name: Daily data pipeline

on:
  schedule:
    - cron: "30 2 * * *"   # every day 02:30 UTC (08:00 IST)
  workflow_dispatch:        # lets you run it manually from the Actions tab

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
        env:
          DATABASE_URL: sqlite://   # tests use their own in-memory DB; never touches production
      - name: Collect data
        run: python run_pipeline.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}              # provided automatically by GitHub
          STACKEXCHANGE_KEY: ${{ secrets.STACKEXCHANGE_KEY }}    # optional
